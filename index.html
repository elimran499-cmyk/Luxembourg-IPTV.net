<!doctype html>
<html lang="lb" class="scroll-smooth">
  <head>
    <!-- Google tag (gtag.js). The inline stub defines gtag() and queues calls
         into dataLayer, so a conversion fired before the remote tag lands is
         kept and replayed. gtag.js itself is deferred until the visitor shows
         intent or the page finishes loading, whichever comes first. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-18345460239');

      (function () {
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18345460239';
          document.head.appendChild(s);
        }
        var events = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        events.forEach(function (e) {
          window.addEventListener(e, loadGtag, {once: true, passive: true, capture: true});
        });
        if (document.readyState === 'complete') loadGtag();
        else window.addEventListener('load', loadGtag, {once: true});
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- The logo, at the sizes a browser and a crawler each ask for. PNG, at a
         stable path, so it can be fetched and indexed on its own. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/images/brand/luxembourg-iptv-logo.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/images/brand/luxembourg-iptv-logo.png" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Title, description, canonical, hreflang, Open Graph and structured
         data are written per language by the locale-pages plugin, from
         src/data/seo.ts. One page per language, each at its own address. -->
    <!--seo-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Outfit for display type, Plus Jakarta Sans for reading copy. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Poster art is served straight from TMDB's CDN; warm the connection. -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  </head>
  <body class="bg-white text-ink-700 antialiased selection:bg-lux-200 selection:text-ink-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
